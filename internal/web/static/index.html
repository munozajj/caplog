<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapLog</title>
<link rel="stylesheet" href="static/style.css">
<script src="static/app.js" defer></script>
</head>
<body>
<div class="book">

  <!-- Shown only before the logbook has a title -->
  <section id="setup" class="cover" hidden>
    <div class="plate">
      <h1>LOGBOOK</h1>
      <p class="small">New logbook setup</p>
      <form id="setup-form" autocomplete="off">
        <label for="title">Logbook title</label>
        <input id="title" name="title" maxlength="200" required>
        <p class="warn">The title is permanent. It can never be changed after you save it.</p>
        <button type="submit">Open logbook</button>
      </form>
    </div>
  </section>

  <!-- The logbook itself -->
  <section id="log" hidden>
    <header class="cover cover-band">
      <div class="plate plate-small">
        <span class="small">LOGBOOK</span>
        <h1 id="log-title"></h1>
      </div>
      <nav class="tools">
        <button type="button" id="export-json">Export JSON</button>
        <button type="button" id="export-pdf">Export PDF</button>
        <button type="button" id="import-btn">Import</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <a href="verify">Verify</a>
        <span id="live" class="live" title="Live updates">&#9679; connecting</span>
      </nav>
    </header>

    <main class="page" id="entries" aria-live="polite"></main>

    <form id="entry-form" class="page entry-form" autocomplete="off">
      <div class="names">
        <label>First name <input id="first" maxlength="100" required></label>
        <label>Last name <input id="last" maxlength="100" required></label>
      </div>
      <label for="text">Entry <span class="small">(Enter to submit, Shift+Enter for a new line)</span></label>
      <textarea id="text" rows="3" required></textarea>
      <div class="row">
        <span id="count" class="small">0 / 500</span>
        <span id="form-msg" class="small err" role="status"></span>
        <button type="submit">Submit</button>
      </div>
    </form>
  </section>
</div>

<!-- Confirmation dialog used for every permanent action -->
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title">Confirm permanent entry</h2>
    <p id="confirm-text"></p>
    <pre id="confirm-preview"></pre>
    <div class="row">
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" type="submit" class="danger" id="confirm-ok">Save permanently</button>
    </div>
  </form>
</dialog>
</body>
</html>
