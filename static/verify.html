<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify - CapLog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Verify</h1>
      <div class="header-actions">
        <a class="btn" href="/">Back to the log</a>
        <button type="button" id="help-btn" class="btn help-btn">?</button>
      </div>
    </div>
  </header>
  <main>
    <section id="result" class="card result">Checking the log…</section>
  </main>
  <aside id="help" class="help" hidden></aside>
  <script src="/static/verify.js"></script>
  <script>
    document.getElementById("help-btn").onclick = async () => {
      const panel = document.getElementById("help");
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.innerHTML = await (await fetch("/static/help/user.html")).text();
      panel.hidden = false;
    };
  </script>
</body>
</html>
