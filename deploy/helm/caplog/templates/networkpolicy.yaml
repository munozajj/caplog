{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "caplog.fullname" . }}
  labels: {{- include "caplog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "caplog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    # Only the app port is reachable.
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.denyEgress }}
  egress: []   # CapLog makes no outbound connections
  {{- end }}
{{- end }}
