{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "caplog.fullname" . }}
  labels: {{- include "caplog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "caplog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        {{- if .Values.https.enabled }}
        - port: {{ .Values.https.port }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- if .Values.database.enabled }}
    - to:
        - podSelector:
            matchLabels: {{- include "caplog.postgresSelector" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    {{- else if .Values.externalDatabase.cidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.cidr | quote }}
      ports:
        - port: {{ .Values.externalDatabase.port }}
          protocol: TCP
    {{- end }}
    # Name resolution for the Postgres Service. UDP 123 is added only when timeCheck.enabled is true.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.timeCheck.enabled }}
    # NTP query only. CapLog does not set the clock.
    - ports:
        - protocol: UDP
          port: 123
    {{- end }}
{{- if .Values.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "caplog.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels: {{- include "caplog.postgresSelector" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "caplog.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
  egress: []
{{- end }}
{{- end }}
