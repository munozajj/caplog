{{- if and .Values.database.enabled (not .Values.database.auth.existingSecret) }}
{{- $name := printf "%s-db" (include "caplog.fullname" .) }}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pg := .Values.database.auth.postgresPassword }}
{{- $owner := .Values.database.auth.ownerPassword }}
{{- $app := .Values.database.auth.appPassword }}
{{- if and (not $pg) $prev (index $prev.data "POSTGRES_PASSWORD") }}{{ $pg = index $prev.data "POSTGRES_PASSWORD" | b64dec }}{{ end }}
{{- if and (not $owner) $prev (index $prev.data "CAPLOG_OWNER_PASSWORD") }}{{ $owner = index $prev.data "CAPLOG_OWNER_PASSWORD" | b64dec }}{{ end }}
{{- if and (not $app) $prev (index $prev.data "CAPLOG_APP_PASSWORD") }}{{ $app = index $prev.data "CAPLOG_APP_PASSWORD" | b64dec }}{{ end }}
{{- if not $pg }}{{ $pg = randAlphaNum 24 }}{{ end }}
{{- if not $owner }}{{ $owner = randAlphaNum 24 }}{{ end }}
{{- if not $app }}{{ $app = randAlphaNum 24 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "caplog.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  CAPLOG_OWNER_PASSWORD: {{ $owner | quote }}
  CAPLOG_APP_PASSWORD: {{ $app | quote }}
  DATABASE_URL: {{ printf "postgresql://caplog_app:%s@%s-postgres:5432/caplog" $app (include "caplog.fullname" .) | quote }}
  CAPLOG_MIGRATE_URL: {{ printf "postgresql://caplog_owner:%s@%s-postgres:5432/caplog" $owner (include "caplog.fullname" .) | quote }}
{{- end }}
