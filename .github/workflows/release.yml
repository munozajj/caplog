# Publishes the container image to GitHub Packages (ghcr.io) - ONLY when a
# version tag like v0.1.0 is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/munozajj/caplog
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Go cross-compiles, so building arm64 too (e.g. Raspberry Pi) is cheap.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
