# Checks every pull request and every change to main.
# Nothing is pushed anywhere; this just proves the code builds and tests pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# If you push again while a run is going, cancel the old run (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # uses the Go version from go.mod; caches modules
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: helm lint
        run: helm lint deploy/helm/caplog

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: caplog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
